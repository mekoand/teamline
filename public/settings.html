<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teamline 辅助设置" />
    <title>Teamline 设置</title>
    <script>
      (() => {
        const saved = localStorage.getItem("teamline-theme");
        const preference = ["system", "light", "dark"].includes(saved) ? saved : "system";
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = preference === "system"
          ? matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          : preference;
      })();
    </script>
    <link rel="stylesheet" href="/settings.css?v=teamline-3-1-closeout-6" />
  </head>
  <body>
    <main class="settings-window">
      <header class="settings-header">
        <div class="settings-drag-region" data-settings-drag-region aria-label="设置窗口标题栏">
          <p class="eyebrow">Teamline</p>
          <h1>偏好设置</h1>
        </div>
        <div class="settings-header-actions">
          <button class="secondary-button" id="settings-close" type="button">关闭</button>
        </div>
      </header>

      <div class="settings-layout">
        <nav class="settings-nav" aria-label="设置分类">
          <button class="settings-nav-item is-selected" type="button" data-settings-section="general">常规</button>
          <button class="settings-nav-item" type="button" data-settings-section="monitoring">会话监控</button>
          <button class="settings-nav-item" type="button" data-settings-section="models">模型</button>
          <button class="settings-nav-item" type="button" data-settings-section="notifications">通知</button>
          <button class="settings-nav-item" type="button" data-settings-section="advanced">高级</button>
        </nav>

        <div class="settings-content">
          <section class="settings-section is-visible" data-settings-panel="general">
            <div class="section-heading">
              <div><p class="eyebrow">常规</p><h2>客户端显示</h2></div>
            </div>
            <label class="setting-row">
              <span><strong>界面语言</strong></span>
              <select id="settings-language" aria-label="界面语言">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="setting-row">
              <span><strong>外观</strong></span>
              <select id="settings-theme" aria-label="外观">
                <option value="system">跟随系统</option>
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </label>
            <p class="settings-feedback" id="general-feedback" role="status"></p>
          </section>

          <section class="settings-section" data-settings-panel="monitoring" hidden>
            <div class="section-heading">
              <div><p class="eyebrow">会话监控</p><h2>自动更新</h2></div>
            </div>
            <label class="setting-row setting-toggle">
              <span><strong>自动更新会话状态</strong></span>
              <input id="monitoring-automatic" type="checkbox" />
            </label>
            <p class="settings-feedback" id="monitoring-feedback" role="status"></p>
          </section>

          <section class="settings-section" data-settings-panel="models" hidden>
            <div class="section-heading">
              <div><p class="eyebrow">模型</p><h2>会话整理模型</h2></div>
            </div>
            <form id="model-settings-form" class="settings-form">
              <fieldset class="source-settings">
                <legend>Codex 来源</legend>
                <label><span>自动模型</span><input id="model-codex-automatic" name="automaticModel" maxlength="200" autocomplete="off" placeholder="来源已配置的低成本模型" /></label>
                <label><span>深度模型</span><input id="model-codex-deep" name="deepModel" maxlength="200" autocomplete="off" placeholder="手动深度整理模型" /></label>
                <label><span>明确替代模型</span><input id="model-codex-fallback" name="fallbackModel" maxlength="200" autocomplete="off" placeholder="自动模型未配置时使用" /></label>
                <label><span>指定账号</span><input id="model-codex-account" name="accountId" maxlength="200" autocomplete="off" placeholder="留空使用当前账号" /></label>
              </fieldset>
              <fieldset class="source-settings source-settings-disabled" disabled>
                <legend>Claude Code 来源</legend>
              </fieldset>
              <div class="settings-actions">
                <button class="primary-button" type="submit">保存模型设置</button>
                <span class="settings-feedback" id="model-feedback" role="status"></span>
              </div>
            </form>
          </section>

          <section class="settings-section" data-settings-panel="notifications" hidden>
            <div class="section-heading">
              <div><p class="eyebrow">通知</p><h2>提醒偏好</h2></div>
            </div>
            <form id="notification-preferences-form" class="settings-form notification-preferences">
              <label class="setting-row setting-toggle"><span><strong>需响应</strong></span><input name="needsResponse" type="checkbox" /></label>
              <label class="setting-row setting-toggle"><span><strong>运行失败</strong></span><input name="runFailed" type="checkbox" /></label>
              <label class="setting-row setting-toggle"><span><strong>目标待验收</strong></span><input name="goalPendingAcceptance" type="checkbox" /></label>
              <label class="setting-row setting-toggle"><span><strong>账号或额度不可用</strong></span><input name="resourceUnavailable" type="checkbox" /></label>
              <div class="settings-actions"><button class="primary-button" type="submit">保存通知偏好</button><span class="settings-feedback" id="notification-feedback" role="status"></span></div>
            </form>
          </section>

          <section class="settings-section" data-settings-panel="advanced" hidden>
            <div class="section-heading">
              <div><p class="eyebrow">高级</p><h2>诊断与本地数据</h2></div>
            </div>
            <section class="advanced-card">
              <div><strong>服务状态</strong><p id="diagnostics-state">正在读取本地服务状态…</p></div>
              <button class="secondary-button" id="refresh-diagnostics" type="button">刷新诊断</button>
            </section>
            <section class="advanced-card">
              <div><strong>导出本地数据</strong><p>导出目标、项目和账号信息。</p></div>
              <button class="secondary-button" id="export-local-state" type="button">导出</button>
            </section>
            <section class="advanced-card restore-card">
              <div><strong>恢复本地数据</strong><p>先预览冲突，再确认恢复。</p></div>
              <input id="restore-state-file" type="file" accept="application/json,.json" />
              <p class="settings-feedback" id="restore-feedback" role="status"></p>
              <div class="restore-actions" hidden id="restore-actions">
                <select id="restore-settings-resolution" aria-label="设置冲突处理"><option value="keep_existing">保留现有设置</option><option value="use_imported">使用导入设置</option></select>
                <button class="secondary-button" id="confirm-state-restore" type="button">确认恢复</button>
              </div>
            </section>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/settings.js?v=teamline-3-1-closeout-3"></script>
  </body>
</html>

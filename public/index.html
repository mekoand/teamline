<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teamline 个人本地工作控制台" />
    <title>Teamline</title>
    <script>
      (() => {
        const saved = localStorage.getItem("teamline-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="console-shell">
      <header class="console-topbar">
        <a class="brand" href="/" aria-label="Teamline 首页">
          <span class="brand-mark">T</span>
          <span>Teamline</span>
        </a>
        <div id="resource-summary" class="resource-summary" aria-live="polite">
          <span>Codex 额度正在读取…</span>
        </div>
        <div class="topbar-status" aria-label="本地服务状态">
          <span class="local-status"><i></i> 本地运行</span>
          <label class="concurrency-control" title="同时运行的委托上限">
            <span>最大并发</span>
            <input id="max-concurrency" type="number" min="1" step="1" value="2" inputmode="numeric" aria-label="本机最大并发数" />
          </label>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深浅色主题">
            <span aria-hidden="true">◐</span>
          </button>
        </div>
      </header>

      <aside class="order-sidebar" aria-label="委托列表">
        <div class="sidebar-heading">
          <div>
            <p class="overline">工作委托</p>
            <h1>当前工作</h1>
          </div>
          <span id="work-order-count" class="count">0</span>
        </div>
        <button class="sidebar-nav" id="open-resources" type="button">
          <span>资源</span><small>额度与用量</small>
        </button>
        <button class="primary-button full-button" id="open-create" type="button">＋ 新建委托</button>
        <div id="work-order-list" class="work-order-list" aria-live="polite"></div>
      </aside>

      <main id="work-order-workspace" class="work-order-workspace" aria-live="polite">
        <div class="loading-state">正在读取本地委托…</div>
      </main>

      <aside id="context-panel" class="context-panel" aria-label="委托上下文">
        <div class="loading-state">正在准备上下文…</div>
      </aside>
    </div>

    <dialog id="create-dialog">
      <form id="create-form">
        <div class="dialog-heading">
          <div>
            <p class="overline">新的工作</p>
            <h2>创建委托</h2>
          </div>
          <button type="button" class="icon-button" id="close-create" aria-label="关闭">×</button>
        </div>

        <label>
          <span>想完成什么</span>
          <textarea name="goal" rows="5" placeholder="例如：整理竞品结论，或为设置页面增加深色模式" required></textarea>
        </label>
        <label>
          <span>完成要求 <em>可选</em></span>
          <textarea name="acceptance" rows="3" placeholder="例如：保留现有布局，并通过相关测试"></textarea>
        </label>

        <section class="material-editor">
          <div class="material-editor-heading">
            <div>
              <strong>参考素材 <em>可选</em></strong>
              <p>可以添加仓库、文件夹、文件、图片或链接；执行文件夹可稍后再选。</p>
            </div>
            <button type="button" class="secondary-button" id="add-material">＋ 添加素材</button>
          </div>
          <div id="material-list" class="material-list"></div>
        </section>

        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary-button" id="cancel-create">取消</button>
          <button type="submit" class="primary-button" id="submit-create">创建委托</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
